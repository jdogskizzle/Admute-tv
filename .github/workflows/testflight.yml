# Builds the app for Apple TV, signs it and uploads it to TestFlight.
# Runs when you push a tag starting with "v" (git tag v1.0.3 && git push --tags), or from the
# Actions tab (TestFlight > Run workflow). Setup: see "TestFlight from GitHub" in README.md.
name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: testflight

jobs:
  upload:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the setup
        run: |
          missing=""
          [ -n "$TEAM_ID" ]   || missing="$missing APPLE_TEAM_ID (variable)"
          [ -n "$BUNDLE_ID" ] || missing="$missing BUNDLE_ID (variable)"
          [ -n "$KEY_ID" ]    || missing="$missing ASC_KEY_ID (secret)"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID (secret)"
          [ -n "$KEY_P8" ]    || missing="$missing ASC_KEY_P8 (secret)"
          if [ -n "$missing" ]; then
            echo "::error::Not set up yet. Missing in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Generate the project
        run: brew install xcodegen && xcodegen generate

      - name: App Store Connect key
        run: |
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID" >> "$GITHUB_ENV"

      # The archive is built unsigned: signing it here would need a development profile,
      # which Apple only issues to teams with a registered device. The upload step signs it
      # for the App Store instead (cloud signing with the key: no certificates to keep).
      # The build number is set from the time (see project.yml).
      - name: Archive
        run: |
          xcodebuild -project AdmuteTV.xcodeproj -scheme AdmuteTV -configuration Release \
            -destination 'generic/platform=tvOS' -archivePath "$RUNNER_TEMP/AdmuteTV.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          echo "build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/AdmuteTV.xcarchive/Products/Applications/AdmuteTV.app/Info.plist")"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AdmuteTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
          echo "Uploaded. It shows in App Store Connect > TestFlight after Apple processes it (5-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
