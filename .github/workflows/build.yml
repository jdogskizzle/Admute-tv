name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks | grep -i tvos
      - name: Generate project
        run: xcodegen generate
      - name: Build for the tvOS simulator
        run: |
          xcodebuild -project AdmuteTV.xcodeproj -scheme AdmuteTV -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build Release for the simulator (checks the icons and the build number)
        run: |
          xcodebuild -project AdmuteTV.xcodeproj -scheme AdmuteTV -configuration Release \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          app=build/Build/Products/Release-appletvsimulator/AdmuteTV.app
          echo "build number: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $app/Info.plist)"
          ls $app | grep -i -E 'assets.car|png'
